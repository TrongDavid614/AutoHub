# HTTP server: chuyển hướng toàn bộ traffic sang HTTPS
server {
    listen 80;
    server_name autohub-vn.id.vn www.autohub-vn.id.vn 103.82.25.169 localhost;

    # Cho phép Certbot tự động gia hạn chứng chỉ ACME
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: Bảo mật SSL chuẩn cho autohub-vn.id.vn
server {
    listen 443 ssl default_server;
    server_name autohub-vn.id.vn www.autohub-vn.id.vn;

    ssl_certificate /etc/letsencrypt/live/autohub-vn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autohub-vn.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression for fast web performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy API requests to backend Spring Boot container
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
