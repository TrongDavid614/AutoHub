server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: autohub-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=AutoHubDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: sa
    password: sapassword
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY1234567890ABCDEF}
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

openrouter:
  api-key: ${OPENROUTER_API_KEY:your_openrouter_api_key_here}
  base-url: https://openrouter.ai/api/v1
  default-model: ${OPENROUTER_DEFAULT_MODEL:liquid/lfm-3-1.7b:free}
  site-url: http://localhost:5173
  app-name: AutoHub

gemini:
  api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
  model: gemini-1.5-pro

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
