server.port=8080
server.servlet.context-path=/api

spring.application.name=autohub-backend

# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=AutoHubDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sapassword@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AI (Google Gemini / OpenAI compatible)
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-3.5-flash}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2500

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=86400000

# SePay Webhook Integration
sepay.api-token=${SEPAY_API_TOKEN:autohub_sepay_secret_2026_998877}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:5811676579}
sepay.bank-brand-name=${SEPAY_BANK_NAME:BIDV}
sepay.sandbox-mode=${SEPAY_SANDBOX_MODE:true}

# OpenRouter DeepSeek
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.model=${OPENROUTER_DEFAULT_MODEL:liquid/lfm-3-1.7b:free}

# Google OAuth2 Client Credentials (provided via environment / .env)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# CORS Configuration
cors.allowed-origins[0]=http://localhost:5173
cors.allowed-origins[1]=http://localhost:3000
cors.allowed-origins[2]=http://103.82.25.169.sslip.io
